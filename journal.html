<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Journal"/>
<meta name="theme-color" content="#080808"/>
<title>Trade Journal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#080808;--surface:#0f0f0f;--border:#1c1c1c;--border2:#2a2a2a;
    --text:#e0e0e0;--muted:#555;--green:#00e5a0;--red:#ff4d6d;--purple:#a78bfa;
    --font:'JetBrains Mono',monospace;
  }
  html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;}
  input,select,textarea,button{font-family:var(--font);}

  /* NAV */
  .nav{position:sticky;top:0;z-index:99;background:#0a0a0a;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  .nav-brand{display:flex;flex-direction:column;}
  .nav-sub{font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
  .nav-title{font-size:17px;font-weight:700;color:#fff;letter-spacing:1px;}
  .nav-tabs{display:flex;gap:6px;}
  .tab{background:transparent;border:1px solid var(--border2);color:var(--muted);border-radius:5px;padding:5px 11px;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;font-weight:600;transition:all .15s;}
  .tab.active{background:var(--green);color:#000;border-color:var(--green);}

  /* MAIN */
  .main{padding:20px;max-width:700px;margin:0 auto;}

  /* STATS GRID */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
  @media(min-width:500px){.stats{grid-template-columns:repeat(4,1fr);}}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
  .stat-label{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
  .stat-val{font-size:22px;font-weight:700;}

  /* EQUITY */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;}
  .card-label{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
  svg.equity{width:100%;height:80px;display:block;}

  /* FILTER */
  .filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filter{background:transparent;border:1px solid var(--border2);color:var(--muted);border-radius:5px;padding:4px 11px;font-size:10px;cursor:pointer;letter-spacing:1px;font-family:var(--font);}
  .filter.active{border-color:var(--green);color:var(--green);background:#0d1a14;}
  .count{margin-left:auto;font-size:11px;color:var(--muted);}

  /* TRADE ROWS */
  .trade-list{display:flex;flex-direction:column;gap:8px;}
  .trade-row{background:var(--surface);border:1px solid var(--border);border-radius:8px;border-left:3px solid var(--border);padding:12px 14px;cursor:pointer;transition:border-color .15s;}
  .trade-row.win{border-left-color:var(--green);}
  .trade-row.loss{border-left-color:var(--red);}
  .trade-row.be{border-left-color:var(--muted);}
  .trade-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .trade-pair{color:var(--purple);font-weight:700;font-size:13px;}
  .trade-dir{font-size:9px;letter-spacing:1px;font-weight:700;}
  .trade-dir.long{color:var(--green);}
  .trade-dir.short{color:var(--red);}
  .trade-result{margin-left:auto;font-size:9px;letter-spacing:1px;font-weight:700;}
  .trade-result.win{color:var(--green);}
  .trade-result.loss{color:var(--red);}
  .trade-result.be{color:var(--muted);}
  .trade-bot{display:flex;gap:14px;font-size:11px;color:var(--muted);}
  .trade-pnl{font-weight:700;}
  .trade-actions{display:flex;gap:6px;margin-top:8px;}
  .btn-sm{background:none;border:1px solid var(--border2);color:var(--muted);border-radius:4px;padding:3px 10px;font-size:10px;cursor:pointer;font-family:var(--font);}
  .btn-del{color:var(--red);}

  /* FORM */
  .form-title{font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:18px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
  .field input,.field select,.field textarea{
    background:#0d0d0d;border:1px solid var(--border2);border-radius:6px;
    color:var(--text);padding:9px 12px;font-size:13px;outline:none;
    width:100%;appearance:none;-webkit-appearance:none;
  }
  .field textarea{resize:vertical;min-height:72px;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);}
  .form-actions{display:flex;gap:10px;margin-top:18px;}
  .btn-primary{background:var(--green);color:#000;border:none;border-radius:6px;padding:11px 24px;font-size:11px;font-family:var(--font);font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;}
  .btn-cancel{background:transparent;color:var(--muted);border:1px solid var(--border2);border-radius:6px;padding:11px 18px;font-size:11px;font-family:var(--font);cursor:pointer;text-transform:uppercase;letter-spacing:1px;}

  .empty{text-align:center;color:#2a2a2a;padding:60px 0;font-size:13px;}
  .empty span{color:var(--green);}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:#0f0f0f;border:1px solid var(--border2);border-radius:12px 12px 0 0;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;padding:20px;}
  @media(min-width:600px){.modal{border-radius:12px;margin:20px;max-height:85vh;}}
  .modal-handle{width:36px;height:3px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-brand">
    <div class="nav-sub">Jericho</div>
    <div class="nav-title">Trade Journal</div>
  </div>
  <div class="nav-tabs">
    <button class="tab active" onclick="showView('dashboard')">Stats</button>
    <button class="tab" onclick="showView('log')">Log</button>
    <button class="tab" onclick="openAddForm()">+ New</button>
  </div>
</div>

<div class="main" id="app"></div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal" style="display:none" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal-inner">
    <div class="modal-handle"></div>
    <div class="form-title" id="form-title">Log Trade</div>
    <div class="form-grid">
      <div class="field"><label>Date</label><input type="date" id="f-date"/></div>
      <div class="field"><label>Pair</label>
        <select id="f-pair">
          <option>EUR/USD</option><option>USD/JPY</option><option>GBP/USD</option>
          <option>USD/CHF</option><option>AUD/USD</option><option>NZD/USD</option>
          <option>USD/CAD</option><option>XAU/USD</option><option>Other</option>
        </select>
      </div>
      <div class="field"><label>Direction</label>
        <select id="f-dir"><option>LONG</option><option>SHORT</option></select>
      </div>
      <div class="field"><label>Setup</label>
        <select id="f-setup">
          <option>BOS</option><option>CHOCH</option><option>FVG</option><option>OB</option>
          <option>Liquidity Sweep</option><option>Fib</option><option>Structure</option><option>Other</option>
        </select>
      </div>
      <div class="field"><label>Entry</label><input type="number" step="any" id="f-entry" placeholder="1.08500"/></div>
      <div class="field"><label>Stop Loss</label><input type="number" step="any" id="f-sl" placeholder="1.08200"/></div>
      <div class="field"><label>Take Profit</label><input type="number" step="any" id="f-tp" placeholder="1.09100"/></div>
      <div class="field"><label>Exit Price</label><input type="number" step="any" id="f-exit" placeholder="1.09050"/></div>
      <div class="field"><label>Lot Size</label><input type="number" step="any" id="f-lot" placeholder="0.01"/></div>
      <div class="field"><label>P&amp;L ($)</label><input type="number" step="any" id="f-pnl" placeholder="+25.00"/></div>
      <div class="field"><label>R:R</label><input type="number" step="any" id="f-rr" placeholder="1.5"/></div>
      <div class="field"><label>Result</label>
        <select id="f-result"><option>WIN</option><option>LOSS</option><option>BE</option></select>
      </div>
      <div class="field full"><label>Notes</label>
        <textarea id="f-notes" placeholder="What did you see? What did you feel? What would you do differently?"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" onclick="saveTrade()">Save Trade</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'jericho-trades-v1';
let trades = [];
let currentView = 'dashboard';
let editId = null;
let filterState = 'ALL';

function load(){
  try{ trades = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch{ trades=[]; }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(trades)); }

function pnlColor(v){
  const n=parseFloat(v);
  if(n>0) return 'var(--green)';
  if(n<0) return 'var(--red)';
  return 'var(--muted)';
}

function calcStats(list){
  if(!list.length) return {total:0,wins:0,losses:0,wr:'0.0',totalPnl:'0.00',avgRR:'0.00',bestWin:'0.00',worstLoss:'0.00'};
  const wins=list.filter(t=>t.result==='WIN');
  const losses=list.filter(t=>t.result==='LOSS');
  const totalPnl=list.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const avgRR=list.reduce((s,t)=>s+(parseFloat(t.rr)||0),0)/list.length;
  const pnls=list.map(t=>parseFloat(t.pnl)||0);
  return{
    total:list.length,wins:wins.length,losses:losses.length,
    wr:((wins.length/list.length)*100).toFixed(1),
    totalPnl:totalPnl.toFixed(2),avgRR:avgRR.toFixed(2),
    bestWin:Math.max(0,...pnls).toFixed(2),
    worstLoss:Math.min(0,...pnls).toFixed(2),
  };
}

function buildEquity(list){
  if(list.length<2) return '';
  let running=0;
  const points=[...list].reverse().map((t,i)=>{
    running+=parseFloat(t.pnl)||0;
    return{i,v:running};
  });
  const min=Math.min(...points.map(p=>p.v));
  const max=Math.max(...points.map(p=>p.v));
  const range=max-min||1;
  const W=600,H=70;
  const x=i=>(i/(points.length-1))*W;
  const y=v=>H-((v-min)/range)*H;
  const path=points.map((p,i)=>`${i===0?'M':'L'} ${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const fill=path+` L ${x(points.length-1).toFixed(1)} ${H} L 0 ${H} Z`;
  return `
    <div class="card">
      <div class="card-label">Equity Curve</div>
      <svg class="equity" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${fill}" fill="url(#eg)"/>
        <path d="${path}" fill="none" stroke="#00e5a0" stroke-width="1.5"/>
      </svg>
    </div>`;
}

function renderDashboard(){
  const s=calcStats(trades);
  const statsHtml=`
    <div class="stats">
      ${stat('Win Rate',s.wr+'%',parseFloat(s.wr)>=50?'var(--green)':'var(--red)')}
      ${stat('Total P&L','$'+s.totalPnl,pnlColor(s.totalPnl))}
      ${stat('Trades',s.total,'#fff')}
      ${stat('Avg R:R',s.avgRR+'R','var(--purple)')}
      ${stat('Wins',s.wins,'var(--green)')}
      ${stat('Losses',s.losses,'var(--red)')}
      ${stat('Best','$'+s.bestWin,'var(--green)')}
      ${stat('Worst','$'+s.worstLoss,'var(--red)')}
    </div>`;
  const eq=buildEquity(trades);
  const empty=trades.length===0?`<div class="empty">No trades yet.<br/>Tap <span>+ New</span> to log your first.</div>`:'';
  return statsHtml+eq+empty;
}

function stat(label,val,color){
  return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-val" style="color:${color}">${val}</div></div>`;
}

function renderLog(){
  const filtered=filterState==='ALL'?trades:trades.filter(t=>t.result===filterState);
  const filterBtns=['ALL','WIN','LOSS','BE'].map(f=>
    `<button class="filter${filterState===f?' active':''}" onclick="setFilter('${f}')">${f}</button>`
  ).join('');
  const countEl=`<span class="count">${filtered.length} trade${filtered.length!==1?'s':''}</span>`;
  const rows=filtered.length===0
    ?`<div class="empty">Nothing here.</div>`
    :filtered.map(t=>{
      const pnl=parseFloat(t.pnl)||0;
      const pnlStr=t.pnl?(pnl>=0?'+':'')+pnl.toFixed(2):'—';
      return`<div class="trade-row ${t.result.toLowerCase()}">
        <div class="trade-top">
          <span class="trade-pair">${t.pair}</span>
          <span class="trade-dir ${t.direction.toLowerCase()}">${t.direction}</span>
          <span style="font-size:11px;color:var(--muted)">${t.setup||''}</span>
          <span class="trade-result ${t.result.toLowerCase()}">${t.result}</span>
        </div>
        <div class="trade-bot">
          <span style="color:var(--muted)">${t.date||'—'}</span>
          <span class="trade-pnl" style="color:${pnlColor(t.pnl)}">${pnlStr}</span>
          <span>${t.rr?t.rr+'R':'—'}</span>
        </div>
        ${t.notes?`<div style="font-size:11px;color:#444;margin-top:6px;border-top:1px solid var(--border);padding-top:6px">${t.notes}</div>`:''}
        <div class="trade-actions">
          <button class="btn-sm" onclick="editTrade(${t.id})">edit</button>
          <button class="btn-sm btn-del" onclick="deleteTrade(${t.id})">delete</button>
        </div>
      </div>`;
    }).join('');
  return `<div class="filters">${filterBtns}${countEl}</div><div class="trade-list">${rows}</div>`;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML = currentView==='dashboard'?renderDashboard():renderLog();
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',(i===0&&currentView==='dashboard')||(i===1&&currentView==='log'));
  });
}

function showView(v){ currentView=v; render(); }
function setFilter(f){ filterState=f; render(); }

function openAddForm(){
  editId=null;
  document.getElementById('form-title').textContent='Log Trade';
  document.querySelector('.btn-primary').textContent='Save Trade';
  ['date','pair','dir','setup','entry','sl','tp','exit','lot','pnl','rr','result','notes'].forEach(k=>{
    const el=document.getElementById('f-'+k);
    if(el) el.value=k==='pair'?'EUR/USD':k==='dir'?'LONG':k==='setup'?'BOS':k==='result'?'WIN':'';
  });
  document.getElementById('modal').style.display='flex';
}

function editTrade(id){
  const t=trades.find(x=>x.id===id);
  if(!t) return;
  editId=id;
  document.getElementById('form-title').textContent='Edit Trade';
  document.querySelector('.btn-primary').textContent='Update Trade';
  document.getElementById('f-date').value=t.date||'';
  document.getElementById('f-pair').value=t.pair||'EUR/USD';
  document.getElementById('f-dir').value=t.direction||'LONG';
  document.getElementById('f-setup').value=t.setup||'BOS';
  document.getElementById('f-entry').value=t.entry||'';
  document.getElementById('f-sl').value=t.sl||'';
  document.getElementById('f-tp').value=t.tp||'';
  document.getElementById('f-exit').value=t.exitPrice||'';
  document.getElementById('f-lot').value=t.lotSize||'';
  document.getElementById('f-pnl').value=t.pnl||'';
  document.getElementById('f-rr').value=t.rr||'';
  document.getElementById('f-result').value=t.result||'WIN';
  document.getElementById('f-notes').value=t.notes||'';
  document.getElementById('modal').style.display='flex';
}

function saveTrade(){
  const date=document.getElementById('f-date').value;
  const pair=document.getElementById('f-pair').value;
  if(!date||!pair) return;
  const t={
    id: editId||Date.now(),
    date, pair,
    direction:document.getElementById('f-dir').value,
    setup:document.getElementById('f-setup').value,
    entry:document.getElementById('f-entry').value,
    sl:document.getElementById('f-sl').value,
    tp:document.getElementById('f-tp').value,
    exitPrice:document.getElementById('f-exit').value,
    lotSize:document.getElementById('f-lot').value,
    pnl:document.getElementById('f-pnl').value,
    rr:document.getElementById('f-rr').value,
    result:document.getElementById('f-result').value,
    notes:document.getElementById('f-notes').value,
  };
  if(editId){
    trades=trades.map(x=>x.id===editId?t:x);
  } else {
    trades.unshift(t);
  }
  save();
  closeModal();
  currentView='log';
  render();
}

function deleteTrade(id){
  if(!confirm('Delete this trade?')) return;
  trades=trades.filter(t=>t.id!==id);
  save();
  render();
}

function closeModal(){ document.getElementById('modal').style.display='none'; }
function handleOverlayClick(e){ if(e.target.id==='modal') closeModal(); }

load();
render();
</script>
</body>
</html>
